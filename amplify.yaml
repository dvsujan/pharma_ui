version: 1
applications:
  - backend:
      phases:
        preBuild:
          commands:
            - npm install
        build:
          commands:
            - npm run build
    frontend:
      phases:
        preBuild:
          commands: []
        build:
          commands: []
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*